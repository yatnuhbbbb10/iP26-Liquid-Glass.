name: iP26 Liquid Glass Android Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'iP26_Liquid_Glass_source_0.1.30-dev.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and inspect source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="iP26_Liquid_Glass_source_0.1.30-dev.zip"
          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p source
          unzip -q "$ARCHIVE" -d source
          echo "=== Archive file listing ==="
          find source -maxdepth 5 -type f | sort | head -300
          PROJECT_SETTINGS="$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "::error::No Gradle settings file found in source archive."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project root: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
          echo "=== Root build.gradle ==="
          cat "$PROJECT_DIR/build.gradle"
          echo "=== App build.gradle ==="
          cat "$PROJECT_DIR/app/build.gradle"

      - name: Audit Xposed API 82 dependency
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon tasks --all
          gradle --no-daemon :app:dependencies --configuration debugCompileClasspath || true
          gradle --no-daemon :app:dependencyInsight --dependency de.robv.android.xposed:api --configuration debugCompileClasspath || true
          if gradle --no-daemon tasks --all | grep -q 'verifyXposedApi82Resolution'; then
            gradle --no-daemon verifyXposedApi82Resolution
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="$(find . -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p verified
          cp "$APK" verified/
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "=== APK file ==="
          ls -lh verified/
          echo "=== aapt badging ==="
          "$AAPT" dump badging "verified/$(basename "$APK")"
          echo "=== apkanalyzer application id ==="
          "$APKANALYZER" manifest application-id "verified/$(basename "$APK")"
          echo "=== apksigner verification ==="
          "$APKSIGNER" verify --verbose "verified/$(basename "$APK")"
          echo "=== Xposed manifest metadata ==="
          "$APKANALYZER" manifest print "verified/$(basename "$APK")" | grep -E 'xposedmodule|xposedminversion|xposed_init' || true


      - name: Audit and package KernelSU module
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          MODULE_DIR="kernelsu-module"
          test -d "$MODULE_DIR"
          echo "=== KernelSU module source ==="
          for file in module.prop customize.sh service.sh uninstall.sh; do
            test -f "$MODULE_DIR/$file" || { echo "::error::Missing $file"; exit 1; }
            echo "===== $file ====="
            cat "$MODULE_DIR/$file"
          done
          python3 - "$MODULE_DIR/module.prop" <<'PY'
          import re, sys
          props = {}
          for raw in open(sys.argv[1], encoding="utf-8"):
              line = raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              props[key.strip()] = value.strip()
          required = ("id", "name", "version", "versionCode", "author", "description")
          missing = [k for k in required if not props.get(k)]
          if missing:
              raise SystemExit("Missing required module.prop keys: " + ", ".join(missing))
          if not re.fullmatch(r"[A-Za-z0-9._-]+", props["id"]):
              raise SystemExit("Invalid module id")
          if not props["versionCode"].isdigit():
              raise SystemExit("versionCode must be numeric")
          print("module.prop metadata: PASS")
          print("Module ID:", props["id"])
          print("Module version:", props["version"])
          PY
          for script in customize.sh service.sh uninstall.sh; do
            head -n 1 "$MODULE_DIR/$script" | grep -q '^#!' || { echo "::error::$script has no shebang"; exit 1; }
            bash -n "$MODULE_DIR/$script"
          done
          PACKAGE="$PWD/kernelsu-package"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE"
          cp "$MODULE_DIR/module.prop" "$MODULE_DIR/customize.sh" "$MODULE_DIR/service.sh" "$MODULE_DIR/uninstall.sh" "$PACKAGE/"
          chmod 0644 "$PACKAGE/module.prop"
          chmod 0755 "$PACKAGE/customize.sh" "$PACKAGE/service.sh" "$PACKAGE/uninstall.sh"
          (cd "$PACKAGE" && zip -X -9 -r "$PWD/../iP26-Liquid-Glass-KernelSU-0.1.30-dev.zip" .)
          ZIP="$PWD/iP26-Liquid-Glass-KernelSU-0.1.30-dev.zip"
          test -s "$ZIP"
          echo "=== ZIP listing ==="
          unzip -l "$ZIP"
          unzip -t "$ZIP"
          python3 - "$ZIP" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = z.namelist()
          expected = {"module.prop", "customize.sh", "service.sh", "uninstall.sh"}
          if set(names) != expected:
              raise SystemExit(f"Unexpected module ZIP root entries: {names}")
          for name in expected:
              info = z.getinfo(name)
              mode = (info.external_attr >> 16) & 0o777
              if name.endswith(".sh") and not (mode & 0o111):
                  raise SystemExit(f"{name} is not executable in ZIP ({oct(mode)})")
          print("KernelSU ZIP structure and executable permissions: PASS")
          PY
          sha256sum "$ZIP"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: iP26-Liquid-Glass-debug-apk
          path: ${{ env.PROJECT_DIR }}/verified/*.apk
          if-no-files-found: error
          retention-days: 14
