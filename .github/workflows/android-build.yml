name: iP26 Liquid Glass Android Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-build.yml'
      - 'iP26_Liquid_Glass_source_0.1.30-dev.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract and inspect source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="iP26_Liquid_Glass_source_0.1.30-dev.zip"
          test -f "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p source
          unzip -q "$ARCHIVE" -d source
          echo "=== Archive file listing ==="
          find source -maxdepth 5 -type f | sort | head -300
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "::error::No Gradle wrapper (gradlew) found in source archive."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"
          echo "Gradle project root: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print

      - name: Audit Xposed API 82 dependency
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon tasks --all
          ./gradlew --no-daemon :app:dependencies --configuration debugCompileClasspath || true
          ./gradlew --no-daemon :app:dependencyInsight --dependency de.robv.android.xposed:api --configuration debugCompileClasspath || true
          if ./gradlew --no-daemon tasks --all | grep -q 'verifyXposedApi82Resolution'; then
            ./gradlew --no-daemon verifyXposedApi82Resolution
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="$(find . -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p verified
          cp "$APK" verified/
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "=== APK file ==="
          ls -lh verified/
          echo "=== aapt badging ==="
          "$AAPT" dump badging "verified/$(basename "$APK")"
          echo "=== apkanalyzer application id ==="
          "$APKANALYZER" manifest application-id "verified/$(basename "$APK")"
          echo "=== apksigner verification ==="
          "$APKSIGNER" verify --verbose "verified/$(basename "$APK")"
          echo "=== Xposed manifest metadata ==="
          "$APKANALYZER" manifest print "verified/$(basename "$APK")" | grep -E 'xposedmodule|xposedminversion|xposed_init' || true

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: iP26-Liquid-Glass-debug-apk
          path: ${{ env.PROJECT_DIR }}/verified/*.apk
          if-no-files-found: error
          retention-days: 14
